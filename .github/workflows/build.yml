name: ساخت APK اندروید

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore: [ "desktop/**", "proxy/**", "**.md" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: نصب وابستگی‌ها
        run: npm install --no-audit --no-fund

      - name: ساخت پوشه اندروید
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: اعمال افزونه پیامک و مجوزها
        run: node tools/patch-android.js

      - name: همگام‌سازی Capacitor
        run: npx cap sync android

      - name: آماده‌سازی کلید امضا
        id: key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/sobhan.jks
            echo "signed=yes" >> $GITHUB_OUTPUT
          else
            echo "کلید امضا تعریف نشده؛ خروجی debug ساخته می‌شود." 
            echo "signed=no" >> $GITHUB_OUTPUT
          fi

      - name: بیلد نسخه امضاشده
        if: steps.key.outputs.signed == 'yes'
        working-directory: android
        env:
          SB_KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          SB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SB_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/sobhan.jks \
            -Pandroid.injected.signing.store.password="$SB_KS_PASS" \
            -Pandroid.injected.signing.key.alias="$SB_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SB_KEY_PASS"

      - name: بیلد نسخه آزمایشی
        if: steps.key.outputs.signed == 'no'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: نام‌گذاری خروجی
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: sobhan-apk
          path: out/*.apk
          retention-days: 30
