<script>
/* ===== sync.js — ادغام‌شده در index.html ===== */
/* ============================================================
   sync.js — همگام‌سازی رکورد به رکورد بین گوشی و ویندوز
   نسخه ۲ — بازنویسی‌شده روی معماری IndexedDB اپ (پایگاه sb_data)

   نصب: فقط یک خط، بعد از اسکریپت اصلی، درست قبل از </body>
       (داخل index.html ادغام شده)
   هیچ تغییری در index.html لازم نیست.

   چطور کار می‌کند
   ---------------
   ۱. توابع سراسری persist / save / del اپ را می‌پوشاند.
   ۲. برای هر رکورد یک اثر انگشت (hash) نگه می‌دارد. هر رکوردی که
      محتوایش عوض شود، فیلد u (مهر زمانی) می‌گیرد. پس تغییر از هر
      مسیری — فرم، پیامک، تحلیل Claude، حضور و غیاب — دیده می‌شود.
   ۳. حذف‌ها در فهرست سنگ‌قبر (__sync_tomb) ثبت می‌شوند تا به
      دستگاه دیگر هم منتقل شوند. بدون این، حذف‌شده دوباره برمی‌گردد.
   ۴. فقط رکوردهای تغییریافته رد و بدل می‌شود. در تضاد، رکورد با u
      بزرگ‌تر می‌ماند.
   ۵. روی COLS اپ حلقه می‌زند، نه روی فهرست ثابت. هر مجموعه‌ی جدیدی
      که بعداً به اپ اضافه شود، خودکار همگام می‌شود.

   آنچه همگام نمی‌شود: عکس‌ها (انبار IndexedDB جدا) و تنظیمات محلی.
   ============================================================ */
(function () {
  "use strict";
  if (window.__sbSync) return;

  var _persist = window.persist, _del = window.del, _vSet = window.vSet;
  if (!_persist || !_del) { console.warn("sync.js: هسته اپ پیدا نشد."); return; }

  var MKEY = "__sync_meta", TKEY = "__sync_tomb", SKEY = "__sync_shadow";
  var TOMB_DAYS = 120, PAGE = 1500;

  var meta = { dev: "", push: 0, cursor: 0, at: 0, err: "" };
  var shadow = {};        // col -> { id: hash }
  var tombs = [];         // [{c,id,u}]
  var ready = false, busy = false, applying = false, timer = null, saveT = null;

  /* ---------- کمک‌ها ---------- */
  function cfg() { try { return (typeof LS !== "undefined" ? LS.get("syncCfg", {}) : {}) || {}; } catch (e) { return {}; } }
  function appCfg() { try { return (typeof LS !== "undefined" ? LS.get("cfg", {}) : {}) || {}; } catch (e) { return {}; } }
  function token() { return cfg().token || appCfg().token || ""; }
  function url() { return (cfg().url || "").replace(/\/+$/, ""); }
  function fnum(n) { try { return typeof fa === "function" ? fa(n) : String(n); } catch (e) { return String(n); } }

  function h32(s) { var h = 5381, i; for (i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h; }
  function recHash(r) {
    var o = {}, k;
    for (k in r) if (k !== "u" && Object.prototype.hasOwnProperty.call(r, k)) o[k] = r[k];
    try { return h32(JSON.stringify(o, Object.keys(o).sort())); } catch (e) { return 0; }
  }

  /* ---------- متادیتا ---------- */
  async function loadMeta() {
    try {
      var m = await DBS.get(MKEY); if (m && typeof m === "object") meta = Object.assign(meta, m);
      var t = await DBS.get(TKEY); if (Array.isArray(t)) tombs = t;
      var s = await DBS.get(SKEY); if (s && typeof s === "object") shadow = s;
    } catch (e) { }
    if (!meta.dev) { meta.dev = (typeof uid === "function" ? uid() : String(Date.now())); await saveMeta(); }
  }
  function saveMeta() { return DBS.set(MKEY, meta).catch(function () { }); }
  function saveTombs() { return DBS.set(TKEY, tombs).catch(function () { }); }
  function saveShadowSoon() { clearTimeout(saveT); saveT = setTimeout(function () { DBS.set(SKEY, shadow).catch(function () { }); }, 1500); }

  /* ---------- مهر زمانی ---------- */
  function stamp(col) {
    if (applying || !S[col]) return 0;
    var old = shadow[col] || {}, seen = {}, now = Date.now(), n = 0, i, r, h;
    for (i = 0; i < S[col].length; i++) {
      r = S[col][i]; if (!r || !r.id) continue;
      h = recHash(r); seen[r.id] = h;
      if (old[r.id] !== h) { r.u = Math.max(now, (+r.u || 0) + 1); n++; }
    }
    shadow[col] = seen;
    if (n) saveShadowSoon();
    return n;
  }
  function reshadow(col) {
    var seen = {}, i, r;
    for (i = 0; i < (S[col] || []).length; i++) { r = S[col][i]; if (r && r.id) seen[r.id] = recHash(r); }
    shadow[col] = seen; saveShadowSoon();
  }
  function stampAll() { var n = 0, i; for (i = 0; i < COLS.length; i++) n += stamp(COLS[i]); return n; }
  function pending() {
    var n = 0, i, j, a;
    for (i = 0; i < COLS.length; i++) { a = S[COLS[i]] || []; for (j = 0; j < a.length; j++) if ((+a[j].u || 0) > meta.push) n++; }
    for (i = 0; i < tombs.length; i++) if (tombs[i].u > meta.push) n++;
    return n;
  }

  /* ---------- پوشاندن هسته ---------- */
  window.persist = function (col) { stamp(col); return _persist(col); };
  window.del = async function (col, id) {
    if (!applying) {
      tombs.push({ c: col, id: id, u: Date.now() });
      if (shadow[col]) delete shadow[col][id];
      saveTombs(); saveShadowSoon();
    }
    return _del(col, id);
  };

  /* ---------- ادغام ---------- */
  function tombAfter(c, id, u) {
    var i; for (i = 0; i < tombs.length; i++) if (tombs[i].c === c && tombs[i].id === id && tombs[i].u >= u) return true;
    return false;
  }
  function applyIn(res) {
    var touched = {}, c, a, i, r, k, idx;
    var chg = res.changes || {};
    for (c in chg) {
      if (!Array.isArray(S[c])) continue;            // مجموعه‌ای که این نسخه اپ نمی‌شناسد: نادیده
      a = chg[c];
      for (i = 0; i < a.length; i++) {
        r = a[i]; if (!r || !r.id) continue;
        idx = S[c].findIndex(function (x) { return x.id === r.id; });
        if (idx < 0) { if (!tombAfter(c, r.id, +r.u || 0)) { S[c].push(r); touched[c] = 1; } }
        else if ((+r.u || 0) > (+S[c][idx].u || 0)) { S[c][idx] = r; touched[c] = 1; }
      }
    }
    var tb = res.tombs || [];
    for (i = 0; i < tb.length; i++) {
      k = tb[i]; if (!k || !Array.isArray(S[k.c])) continue;
      idx = S[k.c].findIndex(function (x) { return x.id === k.id; });
      if (idx >= 0 && (+S[k.c][idx].u || 0) <= (+k.u || 0)) { S[k.c].splice(idx, 1); touched[k.c] = 1; }
      if (!tombs.some(function (t) { return t.c === k.c && t.id === k.id; })) tombs.push({ c: k.c, id: k.id, u: +k.u || 0 });
    }
    return Object.keys(touched);
  }

  function prune() {
    var lim = Date.now() - TOMB_DAYS * 864e5, before = tombs.length;
    tombs = tombs.filter(function (t) { return t.u > lim; });
    if (tombs.length !== before) saveTombs();
  }

  /* ---------- رفت و برگشت ---------- */
  async function post(body) {
    var u = url(); if (!u) throw new Error("آدرس سرور همگام‌سازی وارد نشده است.");
    if (!token()) throw new Error("رمز اپ (APP_TOKEN) وارد نشده است.");
    var ctl = new AbortController(), tm = setTimeout(function () { ctl.abort(); }, 45000);
    try {
      var r = await fetch(u + "/sync", {
        method: "POST", signal: ctl.signal,
        headers: { "x-app-token": token(), "content-type": "application/json" },
        body: JSON.stringify(body)
      });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(j.error || ("کد خطا " + r.status));
      return j;
    } catch (e) {
      throw new Error(e.name === "AbortError" ? "زمان پاسخ سرور تمام شد" : (e.message || "خطای ارتباط"));
    } finally { clearTimeout(tm); }
  }

  async function syncNow(manual) {
    if (busy) return false;
    if (!ready) { if (manual) alert("هنوز آماده نیست، چند لحظه بعد دوباره امتحان کن."); return false; }
    if (!url() || !token()) { if (manual) alert("ابتدا در تنظیمات، آدرس سرور همگام‌سازی و رمز اپ را وارد کن."); return false; }
    busy = true; setStatus("در حال همگام‌سازی...");
    try {
      stampAll(); prune();

      var since = meta.push, changes = {}, out = 0, i, j, a, arr;
      for (i = 0; i < COLS.length; i++) {
        a = S[COLS[i]] || []; arr = [];
        for (j = 0; j < a.length; j++) if ((+a[j].u || 0) > since) arr.push(a[j]);
        if (arr.length) { changes[COLS[i]] = arr; out += arr.length; }
      }
      var tOut = tombs.filter(function (t) { return t.u > since; });
      var started = Date.now(), got = 0, more = true, first = true;

      while (more) {
        var res = await post({
          app: "sobhan-beton", v: 2, device: meta.dev,
          cursor: meta.cursor, limit: PAGE,
          changes: first ? changes : {}, tombs: first ? tOut : []
        });
        first = false;
        var touched = applyIn(res);
        if (touched.length) {
          applying = true;
          for (i = 0; i < touched.length; i++) { reshadow(touched[i]); await _persist(touched[i]); if (window.__undoResnap) window.__undoResnap(touched[i]); }
          applying = false;
        }
        got += (res.count || 0);
        meta.cursor = res.cursor != null ? res.cursor : meta.cursor;
        more = !!res.more;
        await saveMeta();
      }

      meta.push = started; meta.at = Date.now(); meta.err = "";
      await saveMeta(); await saveTombs(); await DBS.set(SKEY, shadow).catch(function () { });

      if (typeof render === "function") render();
      if (typeof syncNotifications === "function") syncNotifications();
      setStatus("");
      if (manual) alert("همگام‌سازی انجام شد.\n" + fnum(out) + " رکورد فرستاده شد، " + fnum(got) + " رکورد گرفته شد.");
      return true;
    } catch (e) {
      meta.err = e.message || String(e); meta.at = meta.at || 0; await saveMeta(); setStatus("");
      if (manual) alert("همگام‌سازی ناموفق بود: " + meta.err);
      return false;
    } finally { busy = false; if (typeof render === "function" && !manual) render(); }
  }

  function setStatus(t) { var el = document.getElementById("syncStat"); if (el) el.textContent = t; }

  /* ---------- کارت تنظیمات ---------- */
  function card() {
    var c = cfg(), p = ready ? pending() : 0;
    var last = meta.at ? (typeof jal === "function" && typeof localISO === "function"
      ? jal(localISO(new Date(meta.at))) + " ساعت " + (typeof faNum === "function" ? faNum(new Date(meta.at).toTimeString().slice(0, 5)) : new Date(meta.at).toTimeString().slice(0, 5))
      : new Date(meta.at).toLocaleString("fa-IR")) : "هنوز انجام نشده";
    var E = typeof esc === "function" ? esc : function (x) { return String(x == null ? "" : x); };
    return '<div class="card"><h3>همگام‌سازی گوشی و ویندوز</h3>' +
      '<div class="note">داده‌ها رکورد به رکورد با سرور خودت ادغام می‌شود. برخلاف پشتیبان‌گیری، چیزی را جایگزین نمی‌کند. عکس‌ها همگام نمی‌شوند.</div>' +
      '<label>آدرس سرور همگام‌سازی</label><input id="syU" dir="ltr" placeholder="https://sync.example.com" value="' + E(c.url || "") + '">' +
      '<label>رمز اپ (اگر با سرور دستیار یکی است، خالی بگذار)</label><input id="syT" dir="ltr" type="password" value="' + E(c.token || "") + '">' +
      '<label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input id="syAuto" type="checkbox" style="width:auto" ' + (c.auto !== false ? "checked" : "") + '> همگام‌سازی خودکار هر ۱۰ دقیقه</label>' +
      '<div class="m" style="margin-top:6px">آخرین همگام‌سازی: ' + last + '</div>' +
      '<div class="m">در انتظار ارسال: <b>' + fnum(p) + '</b> رکورد</div>' +
      (meta.err ? '<div class="m" style="color:var(--bad)">آخرین خطا: ' + E(meta.err) + '</div>' : '') +
      '<div class="row" style="margin-top:9px"><button class="primary" id="syNow">همگام‌سازی الان</button>' +
      '<button class="ghost" id="sySave">ذخیره تنظیمات</button></div>' +
      '<div class="note" id="syncStat" style="margin-top:6px"></div>' +
      '<div class="note" style="margin-top:6px">شناسه این دستگاه: <span dir="ltr">' + E(meta.dev) + '</span></div></div>';
  }
  if (_vSet) window.vSet = function () { return _vSet() + card(); };

  document.addEventListener("click", async function (e) {
    var b = e.target.closest && e.target.closest("button"); if (!b) return;
    var g = function (n) { var el = document.getElementById(n); return el ? el.value.trim() : ""; };
    if (b.id === "sySave") {
      var el = document.getElementById("syAuto");
      LS.set("syncCfg", { url: g("syU"), token: g("syT"), auto: el ? el.checked : true });
      schedule(); setStatus("ذخیره شد."); return;
    }
    if (b.id === "syNow") {
      var e2 = document.getElementById("syAuto");
      LS.set("syncCfg", { url: g("syU"), token: g("syT"), auto: e2 ? e2.checked : true });
      b.disabled = true; await syncNow(true); b.disabled = false; schedule(); return;
    }
  });

  /* ---------- زمان‌بندی ---------- */
  function schedule() {
    clearInterval(timer); timer = null;
    if (cfg().auto === false || !url() || !token()) return;
    timer = setInterval(function () { if (navigator.onLine !== false) syncNow(false); }, 10 * 60000);
  }

  async function boot() {
    for (var i = 0; i < 60; i++) {           // منتظر پایان بارگذاری داده‌های اپ
      if (typeof S !== "undefined" && typeof COLS !== "undefined" && S[COLS[0]]) break;
      await new Promise(function (r) { setTimeout(r, 500); });
    }
    await loadMeta();
    if (!Object.keys(shadow).length) { for (var j = 0; j < COLS.length; j++) reshadow(COLS[j]); }
    ready = true;
    stampAll();
    schedule();
    setTimeout(function () { if (url() && token() && cfg().auto !== false) syncNow(false); }, 4000);
    window.addEventListener("online", function () { syncNow(false); });
    var A = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (A) { try { A.addListener("appStateChange", function (st) { if (st && st.isActive) syncNow(false); }); } catch (e) { } }
  }

  window.__sbSync = { now: syncNow, pending: pending, meta: function () { return meta; } };
  boot();
})();

</script>
<script>
/* ===== import.js — ادغام‌شده در index.html ===== */
/* ============================================================
   import.js — ورود گزارش‌های اکسل گذشته به اپ سبحان بتن

   نصب: کنار index.html و sync.js در پوشه www، و یک خط در انتهای
   index.html بعد از sync.js:
       (داخل index.html ادغام شده)

   سه ورودی:
     ۱. فهرست ماشین‌آلات و رانندگان  (مثل 1405_08_18.xlsx)
     ۲. صورت تعمیرات روزانه تعمیرگاه (مثل تعمیرگاه_19.xlsx)
     ۳. تقسیم مقاطع پمپ             (همه شیت‌های ماهانه یکجا)

   هیچ‌چیز بدون پیش‌نمایش و تأیید ثبت نمی‌شود. تکراری‌ها تشخیص
   داده و رد می‌شوند، پس اگر یک فایل را دو بار بدهی مشکلی نیست.
   خواندن xlsx بدون هیچ کتابخانه‌ی بیرونی انجام می‌شود.
   ============================================================ */
(function () {
  "use strict";
  if (window.__sbImport) return;

  /* ====================== خواندن فایل xlsx ====================== */

  async function inflate(bytes) {
    const ds = new DecompressionStream("deflate-raw");
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(buf);
  }

  async function unzip(ab) {
    const b = new Uint8Array(ab), dv = new DataView(ab);
    let eo = -1;
    for (let i = b.length - 22; i >= 0 && i > b.length - 66000; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eo = i; break; }
    }
    if (eo < 0) throw new Error("فایل فشرده معتبر نیست (xlsx نیست؟)");
    const n = dv.getUint16(eo + 10, true);
    let p = dv.getUint32(eo + 16, true);
    const out = {};
    const dec = new TextDecoder("utf-8");
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const cmtLen = dv.getUint16(p + 32, true);
      const lo = dv.getUint32(p + 42, true);
      const name = dec.decode(b.subarray(p + 46, p + 46 + nameLen));
      const lNameLen = dv.getUint16(lo + 26, true), lExtra = dv.getUint16(lo + 28, true);
      const start = lo + 30 + lNameLen + lExtra;
      const raw = b.subarray(start, start + csize);
      out[name] = { method, raw };
      p += 46 + nameLen + extraLen + cmtLen;
    }
    const files = {};
    for (const k in out) {
      const e = out[k];
      files[k] = e.method === 0 ? e.raw : await inflate(e.raw);
    }
    return files;
  }

  const TD = new TextDecoder("utf-8");
  function xml(bytes) {
    return new DOMParser().parseFromString(TD.decode(bytes), "application/xml");
  }

  /** می‌خواند و برای هر شیت آرایه‌ای از سطرها می‌دهد: {r, c:{A:"..",B:".."}} */
  async function readXlsx(file) {
    const files = await unzip(await file.arrayBuffer());
    const shared = [];
    if (files["xl/sharedStrings.xml"]) {
      const d = xml(files["xl/sharedStrings.xml"]);
      for (const si of d.getElementsByTagName("si")) {
        let s = "";
        for (const t of si.getElementsByTagName("t")) s += t.textContent;
        shared.push(s);
      }
    }
    const rels = {};
    if (files["xl/_rels/workbook.xml.rels"]) {
      const d = xml(files["xl/_rels/workbook.xml.rels"]);
      for (const r of d.getElementsByTagName("Relationship")) {
        let t = r.getAttribute("Target") || "";
        if (t.indexOf("/") !== 0 && t.indexOf("xl/") !== 0) t = "xl/" + t.replace(/^\.\//, "");
        rels[r.getAttribute("Id")] = t.replace(/^\//, "");
      }
    }
    const sheets = [];
    const wbd = xml(files["xl/workbook.xml"]);
    const list = wbd.getElementsByTagName("sheet");
    for (let i = 0; i < list.length; i++) {
      const el = list[i];
      const name = el.getAttribute("name") || ("Sheet" + (i + 1));
      let rid = el.getAttribute("r:id") || el.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
      let path = rels[rid] || ("xl/worksheets/sheet" + (i + 1) + ".xml");
      if (!files[path]) path = "xl/worksheets/sheet" + (i + 1) + ".xml";
      if (!files[path]) continue;
      sheets.push({ name: name, rows: parseSheet(xml(files[path]), shared) });
    }
    return sheets;
  }

  function parseSheet(doc, shared) {
    const rows = [];
    for (const row of doc.getElementsByTagName("row")) {
      const obj = {}, rn = +row.getAttribute("r") || (rows.length + 1);
      let any = false;
      for (const c of row.getElementsByTagName("c")) {
        const ref = c.getAttribute("r") || "", col = ref.replace(/[0-9]/g, "");
        const t = c.getAttribute("t");
        let v = "";
        if (t === "inlineStr") {
          for (const x of c.getElementsByTagName("t")) v += x.textContent;
        } else {
          const vn = c.getElementsByTagName("v")[0];
          if (!vn) continue;
          v = vn.textContent;
          if (t === "s") v = shared[+v] || "";
        }
        v = String(v).trim();
        if (v !== "") { obj[col] = v; any = true; }
      }
      if (any) rows.push({ r: rn, c: obj });
    }
    return rows;
  }

  /* ====================== کمک‌ها ====================== */

  const clean = s => String(s == null ? "" : s).replace(/\u0640+/g, "").replace(/[\s\u200c]+/g, " ").trim();
  const digits = s => clean(s).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));

  /** "1405/08/19" یا "1405/8/9" را به تاریخ میلادی اپ تبدیل می‌کند */
  function jdate(s) {
    const m = digits(s).match(/(\d{4})\s*[\/\-\.]\s*(\d{1,2})\s*[\/\-\.]\s*(\d{1,2})/);
    if (!m) return "";
    const jy = +m[1], jm = +m[2], jd = +m[3];
    if (jy < 1300 || jy > 1500 || jm < 1 || jm > 12 || jd < 1 || jd > 31) return "";
    try { return jToIso(jy, jm, jd); } catch (e) { return ""; }
  }

  function num(s) {
    const v = parseFloat(digits(s).replace(/[^\d.\-]/g, ""));
    return isFinite(v) ? v : 0;
  }

  /** سطر سرستون را پیدا می‌کند و نگاشت عنوان→ستون می‌دهد (هم دقیق، هم با کلیدواژه) */
  function header(rows, needles, limit) {
    for (let i = 0; i < Math.min(rows.length, limit || 12); i++) {
      const c = rows[i].c, map = {};
      for (const col in c) { const t = clean(c[col]); if (t && map[t] === undefined) map[t] = col; }
      let hit = 0;
      for (const n of needles) {
        if (map[n] !== undefined) { hit++; continue; }
        for (const t in map) if (t.indexOf(n) >= 0) { map[n] = map[t]; hit++; break; }
      }
      if (hit >= Math.ceil(needles.length * 0.6)) return { i: i, map: map };
    }
    return null;
  }

  const normPlate = s => digits(s).replace(/[^\dA-Za-zآ-ی]/g, "");

  /* ====================== نگاشت‌ها ====================== */

  const GRP = [
    [/میکسر/, "میکسر"], [/تریلی/, "کمپرسی تریلی"], [/کمپرسی/, "کمپرسی"],
    [/کشنده/, "کشنده"], [/پمپ/, "پمپ بتن"],
    [/لودر/, "لودر"], [/جرثقیل/, "سایر"], [/تانکر/, "تانکر آب"],
    [/بچینگ/, "بچینگ"], [/ژنراتور|دیزل/, "دیزل ژنراتور"]
  ];
  /** اگر متن یکی از گروه‌های شناخته‌شده باشد نوع را می‌دهد، وگرنه null */
  const grpOf = s => { const t = clean(s); for (const [re, v] of GRP) if (re.test(t)) return v; return null; };
  const typeOf = s => grpOf(s) || "سایر";

  function statusOf(st, drv) {
    const s = clean(st), d = clean(drv);
    if (/از خط خارج|فروش/.test(d) || /از خط خارج|فروش/.test(s)) return "غیرفعال";
    if (/تعمیر/.test(s)) return "در تعمیر";
    return "فعال";
  }

  const SECT = [
    [/فونداسیون|فنداسیون|فونداسین/, "فونداسیون"],
    [/دیوار\s*و\s*ستون|دیوارستون/, "دیوار و ستون"],
    [/^ستون/, "ستون"], [/^دیوار/, "دیوار"],
    [/سقف/, "سقف"], [/^کف/, "کف"], [/چاه/, "چاه"], [/مگر/, "مگر"],
    [/خرپشته/, "خرپشته"], [/راه\s*پله|پله/, "راه پله"], [/شمع/, "شمع"], [/رمپ/, "رمپ"]
  ];
  function sectOf(s) {
    const t = clean(s); if (!t) return "نامشخص";
    for (const [re, v] of SECT) if (re.test(t)) return v;
    return t;
  }

  /** ساعت را از متن «۲۱:۱۹» یا از عدد اکسل (کسری از شبانه‌روز) درمی‌آورد */
  function timeOf(v) {
    const t = digits(v);
    const m = t.match(/(\d{1,2}):(\d{2})/);
    if (m) return ("0" + m[1]).slice(-2) + ":" + m[2];
    const f = parseFloat(t);
    if (!isFinite(f) || f < 0) return "";
    const frac = f - Math.floor(f);
    if (f !== 0 && frac === 0) return "";
    const mins = Math.round(frac * 1440) % 1440;
    return ("0" + Math.floor(mins / 60)).slice(-2) + ":" + ("0" + (mins % 60)).slice(-2);
  }

  /* ====================== پارسرها ====================== */

  /* ۱ — فهرست ماشین‌آلات و رانندگان */
  function parseFleet(sheets) {
    const out = { machines: [], contacts: [] }, seen = {};
    for (const sh of sheets) {
      const h = header(sh.rows, ["شماره ماشین", "نوع ماشین", "نام راننده", "آخرین وضعیت"], 8);
      if (!h) continue;
      const M = h.map, lab = {};
      let group = "";
      for (let i = h.i; i < sh.rows.length; i++) {
        const c = sh.rows[i].c;
        for (const col in c) {               // عنوان گروه در ستون سمت راست جدول
          if (col < M["شماره ماشین"] && col !== M["شماره ماشین"]) {
            const t = clean(c[col]).replace(/\s/g, "");
            if (t.length > 2 && !/^\d+$/.test(t) && grpOf(t)) group = t;
          }
        }
        const plate = clean(c[M["شماره ماشین"]] || "");
        const kind = clean(c[M["نوع ماشین"]] || "");
        if (!plate || plate === "نوع ماشین") continue;
        if (!/\d/.test(digits(plate)) && !/یدک|لودر/.test(plate)) continue;
        const drv = clean(c[M["نام راننده"]] || "");
        const st = clean(c[M["آخرین وضعیت"]] || "");
        const isSpare = /^یدک$/.test(plate);
        const code = isSpare ? kind : digits(plate);
        if (!code || seen[code]) continue; seen[code] = 1;
        const type = grpOf(kind) || typeOf(group);
        out.machines.push({
          id: uid(), name: (isSpare ? "پمپ " + kind : kind + " " + code).trim(),
          type: type, status: statusOf(st, drv), code: code, model: kind, year: "",
          driver: /بدون راننده|از خط خارج/.test(drv) ? "" : drv,
          unit: type === "لودر" ? "ساعت" : "کیلومتر", usage: 0,
          insDue: "", inspDue: "", licDue: "",
          notes: [st, clean(c[M["شرح خرابی ماشین"]] || "")].filter(Boolean).join(" — ").slice(0, 300)
        });
      }
    }
    const names = {};
    for (const m of out.machines) {
      const d = clean(m.driver);
      if (!d || names[d]) continue; names[d] = 1;
      out.contacts.push({
        id: uid(), role: m.type === "بچینگ" ? "اپراتور بچینگ" : m.type === "لودر" ? "اپراتور / سایر" : "راننده",
        name: d, phone: "", machineId: m.id, hire: "", licDue: "", active: true, notes: ""
      });
    }
    return out;
  }

  /* ۲ — صورت تعمیرات روزانه تعمیرگاه */
  function parseWorkshop(sheets) {
    const out = [];
    for (const sh of sheets) {
      const h = header(sh.rows, ["شماره پلاک", "شرح عیب", "تاریخ", "شماره گزارش", "تعمیرکار", "وضعیت"], 8);
      if (!h) continue;
      const M = h.map;
      for (let i = h.i + 1; i < sh.rows.length; i++) {
        const c = sh.rows[i].c;
        const plate = clean(c[M["شماره پلاک"]] || "");
        const desc = clean(c[M["شرح عیب"]] || "");
        if (!plate || !desc) continue;
        const d = jdate(c[M["تاریخ"]] || "");
        out.push({
          plate: plate, date: d, desc: desc,
          rep: clean(c[M["تعمیرکار"]] || ""),
          st: clean(c[M["وضعیت"]] || ""),
          no: digits(c[M["شماره گزارش"]] || "")
        });
      }
    }
    return out;
  }

  const CAUSE = [
    [/باطری|چراغ|دینام|استارت|برق|پروژکتور|فیوز|سیم/, "برقی"],
    [/هیدرولیک|جک|پمپ روغن|شیلنگ فشار/, "هیدرولیک"],
    [/موتور|رادیاتور|واتر|سوپاپ|میلنگ|کمپرس|توربو/, "موتور"],
    [/لاستیک|پنچر|تایر/, "لاستیک"],
    [/تصادف|واژگون|صافکاری/, "تصادف"],
    [/گیربکس|دیفرانسیل|اکسل|ترمز|کلاچ|دیسک|جلوبندی|گاردان|یاتاقان|بلبرینگ|فنر/, "مکانیکی"]
  ];
  function causeOf(t) { for (const [re, v] of CAUSE) if (re.test(t)) return v; return "سایر"; }

  /* ۳ — تقسیم مقاطع پمپ */
  function parsePump(sheets) {
    const out = [];
    for (const sh of sheets) {
      if (/^Sheet\d*$/i.test(sh.name) || /رضایت/.test(sh.name)) continue;
      const h = header(sh.rows, ["تاریخ", "نام مشتری", "مقطع", "متراژ", "عیار", "پمپ ارسالی"], 6);
      if (!h) continue;
      const M = h.map;
      for (let i = h.i + 1; i < sh.rows.length; i++) {
        const c = sh.rows[i].c;
        const d = jdate(c[M["تاریخ"]] || "");
        const m3 = num(c[M["متراژ"]] || "");
        if (!d || !(m3 > 0)) continue;
        out.push({
          date: d, m3: m3,
          customer: clean(c[M["نام مشتری"]] || ""),
          addr: clean(c[M["آدرس"]] || ""),
          section: sectOf(c[M["مقطع"]] || ""),
          grade: clean(c[M["عیار"]] || ""),
          pump: clean(c[M["پمپ ارسالی"]] || ""),
          tSend: timeOf(c[M["ساعت ارسال پمپ"]] || ""),
          tStart: timeOf(c[M["ساعت شروع بار"]] || ""),
          tEnd: timeOf(c[M["ساعت اتمام بار"]] || ""),
          resp: clean(c[M["نام مسئول ترانسپورت"]] || ""),
          src: sh.name
        });
      }
    }
    return out;
  }

  /* ====================== ثبت ====================== */

  function machByPlate(p) {
    const k = normPlate(p);
    if (!k) return null;
    return S.machines.find(m => normPlate(m.code) === k)
      || S.machines.find(m => normPlate(m.name).indexOf(k) >= 0) || null;
  }

  async function commitFleet(d) {
    let nm = 0, nc = 0;
    for (const m of d.machines) {
      if (S.machines.some(x => normPlate(x.code) === normPlate(m.code))) continue;
      S.machines.push(m); nm++;
    }
    for (const c of d.contacts) {
      if (S.contacts.some(x => clean(x.name) === clean(c.name))) continue;
      const mm = S.machines.find(x => x.id === c.machineId);
      if (!mm) c.machineId = "";
      S.contacts.push(c); nc++;
    }
    if (nm) await persist("machines");
    if (nc) { await persist("contacts"); if (typeof pushWatch === "function") pushWatch(); }
    return nm + " دستگاه و " + nc + " نفر ثبت شد.";
  }

  async function commitWorkshop(rows) {
    let n = 0, skipNoMach = 0, dup = 0;
    for (const r of rows) {
      const m = machByPlate(r.plate);
      if (!m) { skipNoMach++; continue; }
      const title = r.desc.slice(0, 160);
      if (S.faults.some(f => f.machineId === m.id && f.date === r.date && clean(f.title) === clean(title))) { dup++; continue; }
      S.faults.push({
        id: uid(), machineId: m.id, title: title, date: r.date || todayISO(),
        cause: causeOf(r.desc), stopped: false, cost: 0,
        notes: [r.no ? "گزارش " + r.no : "", r.rep ? "تعمیرکار: " + r.rep : "", r.st, r.desc].filter(Boolean).join(" — "),
        photos: [], status: /ترخیص|انجام|رفع|تحویل/.test(r.st) ? "done" : "open"
      });
      n++;
    }
    if (n) await persist("faults");
    return n + " خرابی ثبت شد" + (dup ? "، " + dup + " تکراری رد شد" : "") +
      (skipNoMach ? "، " + skipNoMach + " سطر چون پلاکش در ماشین‌آلات نبود رد شد" : "") + ".";
  }

  async function commitPump(rows) {
    const key = x => [x.date, clean(x.customer), x.m3, x.tStart || "", clean(x.pump), x.section].join("|");
    const have = {}, want = {};
    for (const p of S.pumpjobs) { const k = key(p); have[k] = (have[k] || 0) + 1; }
    let n = 0, dup = 0;
    for (const r of rows) {
      const k = key(r);
      want[k] = (want[k] || 0) + 1;
      if (want[k] <= (have[k] || 0)) { dup++; continue; }   // همین تعداد از قبل هست
      S.pumpjobs.push(Object.assign({ id: uid() }, r));
      n++;
    }
    if (n) await persist("pumpjobs");
    return n + " رکورد پمپاژ ثبت شد" + (dup ? "، " + dup + " تکراری رد شد" : "") + ".";
  }

  /* ====================== نما ====================== */

  const KIND = {
    fleet: { t: "فهرست ماشین‌آلات و رانندگان", p: parseFleet, c: commitFleet, hint: "فایلی مثل 1405_08_18.xlsx — پایه‌ی همه‌چیز است، اول این." },
    ws: { t: "صورت تعمیرات روزانه تعمیرگاه", p: parseWorkshop, c: commitWorkshop, hint: "فایل‌های تعمیرگاه. اول باید ماشین‌آلات وارد شده باشد." },
    pump: { t: "تقسیم مقاطع پمپ", p: parsePump, c: commitPump, hint: "همه‌ی شیت‌های ماهانه با هم خوانده می‌شود." }
  };
  let pending = null, busy = false, msg = "";

  function previewHtml() {
    if (!pending) return "";
    const k = pending.kind, d = pending.data;
    let rows = "", count = 0;
    if (k === "fleet") {
      count = d.machines.length;
      rows = d.machines.slice(0, 10).map(m =>
        `<tr><td>${esc(m.code)}</td><td>${esc(m.type)}</td><td>${esc(m.driver || "—")}</td><td>${esc(m.status)}</td></tr>`).join("");
      rows = `<table><tr><th>پلاک</th><th>نوع</th><th>راننده</th><th>وضعیت</th></tr>${rows}</table>
        <div class="m">${fa(d.machines.length)} دستگاه و ${fa(d.contacts.length)} نفر.</div>`;
    } else if (k === "ws") {
      count = d.length;
      rows = d.slice(0, 10).map(x =>
        `<tr><td>${esc(x.plate)}</td><td>${x.date ? jal(x.date) : "—"}</td><td>${esc(x.desc.slice(0, 60))}</td></tr>`).join("");
      rows = `<table><tr><th>پلاک</th><th>تاریخ</th><th>شرح عیب</th></tr>${rows}</table>`;
    } else {
      count = d.length;
      const tot = d.reduce((a, x) => a + x.m3, 0), by = {};
      for (const x of d) by[x.section] = (by[x.section] || 0) + x.m3;
      const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 6)
        .map(([s, v]) => `<tr><td>${esc(s)}</td><td>${fa(Math.round(v))}</td></tr>`).join("");
      rows = `<div class="m">مجموع ${fa(Math.round(tot))} متر مکعب در ${fa(d.length)} نوبت پمپاژ.</div>
        <table><tr><th>مقطع</th><th>متر مکعب</th></tr>${top}</table>`;
    }
    return `<div class="card"><h3>پیش‌نمایش — ${esc(KIND[k].t)}</h3>${rows}
      <div class="row" style="margin-top:9px">
        <button class="primary" id="impOk" ${count ? "" : "disabled"}>تأیید و ثبت</button>
        <button class="ghost" id="impNo">انصراف</button></div></div>`;
  }

  function vImport() {
    const cards = Object.keys(KIND).map(k =>
      `<div class="card"><h3>${esc(KIND[k].t)}</h3><div class="note">${esc(KIND[k].hint)}</div>
       <input type="file" id="f_${k}" accept=".xlsx" multiple style="margin-top:8px">
       <div class="row" style="margin-top:8px"><button class="ghost" data-imp="${k}">خواندن فایل</button></div></div>`).join("");
    const have = S.pumpjobs && S.pumpjobs.length
      ? `<div class="card"><h3>سابقه پمپاژ در اپ</h3><div class="m">${fa(S.pumpjobs.length)} نوبت، مجموع ${fa(Math.round(S.pumpjobs.reduce((a, x) => a + (+x.m3 || 0), 0)))} متر مکعب.</div></div>` : "";
    return `<div class="card"><h3>ورود از فایل اکسل</h3>
      <div class="note">فایل‌های گذشته را اینجا وارد کن تا از نو تایپ نشوند. ترتیب مهم است: اول ماشین‌آلات، بعد بقیه.</div>
      ${msg ? `<div class="m" style="margin-top:6px">${esc(msg)}</div>` : ""}
      <div class="note" id="impStat" style="margin-top:6px"></div></div>
      ${previewHtml()}${cards}${have}`;
  }

  /* ====================== اتصال به اپ ====================== */

  const _render = window.render;
  window.render = function () {
    if (typeof tab === "undefined" || tab !== "imp") return _render();
    document.getElementById("todayLbl").textContent = jal(todayISO())+" • نسخه "+APP_BUILD;
    document.getElementById("nav").innerHTML = TABS.map(([k, n]) =>
      `<button data-tab="${k}" class="${k === tab ? "active" : ""}">${n}</button>`).join("");
    document.getElementById("main").innerHTML = vImport();
  };

  function stat(t) { const e = document.getElementById("impStat"); if (e) e.textContent = t; }

  document.addEventListener("click", async function (e) {
    const b = e.target.closest && e.target.closest("button"); if (!b) return;
    if (b.dataset.imp) {
      const k = b.dataset.imp, inp = document.getElementById("f_" + k);
      const files = [...((inp && inp.files) || [])];
      if (!files.length) return alert("اول فایل را انتخاب کن.");
      if (busy) return; busy = true; stat("در حال خواندن...");
      try {
        let sheets = [];
        for (const f of files) sheets = sheets.concat(await readXlsx(f));
        const data = KIND[k].p(sheets);
        const n = k === "fleet" ? data.machines.length : data.length;
        if (!n) { msg = "در این فایل سطر قابل استفاده‌ای پیدا نشد. مطمئن شو فایل درست را به بخش درست داده‌ای."; pending = null; }
        else { pending = { kind: k, data: data }; msg = ""; }
      } catch (err) {
        msg = "خواندن فایل ناموفق بود: " + (err.message || err); pending = null;
      }
      busy = false; render(); window.scrollTo(0, 0); return;
    }
    if (b.id === "impNo") { pending = null; msg = ""; render(); return; }
    if (b.id === "impOk") {
      if (!pending || busy) return;
      busy = true; b.disabled = true; b.textContent = "در حال ثبت...";
      try { msg = await KIND[pending.kind].c(pending.data); pending = null; }
      catch (err) { msg = "ثبت ناموفق بود: " + (err.message || err); }
      busy = false; render(); return;
    }
  });

  async function boot() {
    for (let i = 0; i < 60; i++) {
      if (typeof S !== "undefined" && typeof COLS !== "undefined" && S[COLS[0]]) break;
      await new Promise(r => setTimeout(r, 500));
    }
    if (COLS.indexOf("pumpjobs") < 0) COLS.push("pumpjobs");
    if (!Array.isArray(S.pumpjobs)) {
      try { S.pumpjobs = (await DBS.get("pumpjobs")) || []; } catch (e) { S.pumpjobs = []; }
    }
    if (!TABS.some(t => t[0] === "imp")) TABS.push(["imp", "ورود از فایل"]);
    if (!("DecompressionStream" in window)) console.warn("import.js: این نسخه مرورگر xlsx را باز نمی‌کند.");
    render();
  }

  window.__sbImport = { read: readXlsx };
  boot();
})();

</script>
<script>
/* ===== برگشت عملیات: هر تغییر داده ثبت می‌شود و با یک دکمه برمی‌گردد ===== */
(function () {
  "use strict";
  var COLN = { machines: "دستگاه", contacts: "پرسنل", sms: "پیام", trips: "سرویس", faults: "خرابی", fuel: "سوخت‌گیری", prod: "تولید روزانه", opprod: "تولید اوپراتور",
    parts: "قطعه", returns: "بتن برگشتی", silos: "شمارش سیلو", counts: "شمارش مواد", receipts: "ورود مصالح", scores: "کسری کارکرد", norms: "نُرم", pumpjobs: "پمپاژ",
    att: "حضور و غیاب", washes: "شستشو", jobs: "کار محوطه", tasks: "کار", incidents: "حادثه", stops: "توقف تولید", log: "سابقه‌ی دستگاه", notes: "یادداشت", ideas: "ایده",
    check: "مورد چک‌لیست", ticks: "تیک چک‌لیست", rem: "یادآوری", tires: "لاستیک", mixes: "طرح اختلاط", batches: "بچ", calib: "کالیبراسیون", reports: "گزارش", looks: "بازدید ظاهری" };
  var snap = {}, stack = [], gid = 0, undoing = false, tm = 0, MAXG = 40;
  function strip(r) { var o = Object.assign({}, r); delete o.u; return JSON.stringify(o); }
  function resnap(col) { var m = {}, a = S[col] || [], i; for (i = 0; i < a.length; i++) if (a[i] && a[i].id != null) m[a[i].id] = strip(a[i]); snap[col] = m; }
  window.__undoResnap = resnap;
  function label(g) { var by = {}, keys;
    g.ch.forEach(function (x) { var v = x.o == null ? "افزودن" : x.gone ? "حذف" : "تغییر", k = v + "|" + x.c; by[k] = (by[k] || 0) + 1; });
    keys = Object.keys(by);
    return keys.slice(0, 3).map(function (k) { var p = k.split("|"); return p[0] + " " + (by[k] > 1 ? fa(by[k]) + " " : "") + (COLN[p[1]] || p[1]); }).join("، ") + (keys.length > 3 ? " و…" : ""); }
  function rec(col) {
    if (!snap[col]) { resnap(col); return; }
    var old = snap[col], cur = {}, ch = [], a = S[col] || [], i, r, j, id, g, now = Date.now();
    for (i = 0; i < a.length; i++) { r = a[i]; if (!r || r.id == null) continue; j = strip(r); cur[r.id] = j;
      if (!(r.id in old)) ch.push({ c: col, id: r.id, o: null }); else if (old[r.id] !== j) ch.push({ c: col, id: r.id, o: old[r.id] }); }
    for (id in old) if (!(id in cur)) ch.push({ c: col, id: id, o: old[id], gone: true });
    snap[col] = cur;
    if (undoing || !ch.length || (gid === 0 && col === "check")) return;   // فهرست پیش‌فرض اولین اجرا قابل برگشت نیست
    g = stack[stack.length - 1];
    if (!g || g.gid !== gid || now - g.at > 20000) { g = { gid: gid, at: now, ch: [] }; stack.push(g); if (stack.length > MAXG) stack.shift(); }
    ch.forEach(function (x) { var y = g.ch.find(function (z) { return z.c === x.c && String(z.id) === String(x.id); });
      if (!y) g.ch.push(x); else y.gone = !!x.gone; });           // قدیمی‌ترین حالت هر رکورد در گروه نگه داشته می‌شود
    g.ch = g.ch.filter(function (y) { return !(y.o == null && y.gone); });   // در همین عمل ساخته و حذف شده
    g.at = now; if (!g.ch.length) { stack.pop(); return; }
    g.label = label(g); toast(g.label + " انجام شد", true);
  }
  var _p = window.persist;
  window.persist = function (col) { try { rec(col); } catch (e) { } return _p.apply(this, arguments); };
  async function undoLast() {
    var g = stack.pop(); if (!g) { toast("چیزی برای برگشت نیست", false); return; }
    undoing = true;
    try { var cols = {}, list = g.ch.slice().reverse(), k, x, a, i;
      for (k = 0; k < list.length; k++) { x = list[k]; a = S[x.c]; if (!Array.isArray(a)) continue;
        i = a.findIndex(function (r) { return String(r.id) === String(x.id); });
        if (x.o == null) { if (i >= 0) await window.del(x.c, a[i].id); }
        else { var r0 = JSON.parse(x.o); a = S[x.c]; i = a.findIndex(function (r) { return String(r.id) === String(x.id); }); if (i >= 0) a[i] = r0; else a.push(r0); cols[x.c] = 1; } }
      for (k in cols) await window.persist(k);
      g.ch.forEach(function (y) { resnap(y.c); });
    } finally { undoing = false; }
    if (typeof render === "function") render();
    if (typeof syncNotifications === "function") syncNotifications();
    toast("«" + g.label + "» برگشت داده شد", false);
  }
  function toast(text, withBtn) {
    var el = document.getElementById("undoToast");
    if (!el) { el = document.createElement("div"); el.id = "undoToast";
      el.style.cssText = "position:fixed;left:12px;right:12px;bottom:86px;z-index:70;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:14px;background:#111827;color:#fff;font-size:14px;box-shadow:0 6px 20px #0007";
      document.body.appendChild(el); }
    el.innerHTML = '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(text) + "</span>" + (withBtn ? '<button data-undo="1" style="min-height:0;padding:6px 14px;border-radius:10px;background:#f59e0b;color:#111;border:0;font-weight:700;white-space:nowrap">برگشت</button>' : "");
    el.style.display = "flex"; clearTimeout(tm); tm = setTimeout(function () { el.style.display = "none"; }, withBtn ? 9000 : 3500);
  }
  function history() {
    var h = '<div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">برگشت عملیات</h3><button class="ghost" data-jdclose="1">بستن</button></div><div style="max-height:58vh;overflow:auto;margin-top:8px">';
    if (!stack.length) h += '<div class="empty">در این نشست تغییری ثبت نشده است.</div>';
    else h += stack.slice().reverse().map(function (g, i) { var d = new Date(g.at);
      return '<div class="item"><div class="t">' + esc(g.label) + '</div><div class="m">' + faNum(String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0")) + "</div>" +
        (i === 0 ? '<div class="row" style="margin-top:6px"><button class="primary" data-undo="1">برگشت این عمل</button></div>' : "") + "</div>"; }).join("") +
      '<div class="note">عملیات به ترتیب، از آخر به اول برمی‌گردند. با بستن اپ این فهرست خالی می‌شود.</div>';
    showModal(h + "</div>");
  }
  document.addEventListener("click", function (e) { var t = e.target; if (t && t.closest && (t.closest("#undoBtn") || t.closest("[data-undo]") || t.closest("#undoToast"))) return; gid++; }, true);
  document.addEventListener("change", function () { gid++; }, true);
  document.addEventListener("click", async function (e) { var t = e.target; if (!t || !t.closest) return;
    if (t.closest("[data-undo]")) { var inModal = !!t.closest("#modal"); await undoLast(); if (inModal) history(); return; }
    if (t.closest("#undoBtn")) history(); });
  var iv = setInterval(function () { if (typeof ready !== "undefined" && ready) { clearInterval(iv); COLS.forEach(function (c) { if (!snap[c]) resnap(c); }); } }, 300);
  window.__undo = { last: undoLast, stack: stack };
})();

</script>
